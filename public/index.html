<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hetrax Pubg Key Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif}
        .rd{border-radius:28px!important}
        body{background:#050505;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;position:relative;overflow-x:hidden}
        .glow{position:fixed;width:700px;height:700px;background:radial-gradient(circle,rgba(138,43,226,.15) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);z-index:-1;animation:pg 4s infinite alternate}
        @keyframes pg{0%{transform:translate(-50%,-50%) scale(1);opacity:.5}100%{transform:translate(-50%,-50%) scale(1.2);opacity:1}}
        .wrap{width:100%;max-width:480px;padding:20px;z-index:1;transition:max-width .4s}
        .card{background:rgba(15,15,20,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(138,43,226,.35);border-radius:20px;padding:45px;box-shadow:0 0 40px rgba(138,43,226,.12)}
        .logo{font-size:40px;font-weight:800;text-align:center;letter-spacing:5px;background:linear-gradient(90deg,#8a2be2,#d100ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
        .logo.sm{font-size:24px}
        .sub{text-align:center;font-size:10px;letter-spacing:3px;color:#555;margin-bottom:35px;font-weight:600;text-transform:uppercase}
        .ig{position:relative;margin-bottom:35px}
        .ig input{width:100%;padding:12px 0;font-size:16px;color:#fff;border:none;border-bottom:1px solid #333;outline:none;background:transparent;transition:.3s}
        .ig label{position:absolute;top:12px;left:0;font-size:16px;color:#555;pointer-events:none;transition:.3s}
        .ig input:focus~label,.ig input:valid~label{top:-16px;font-size:11px;color:#8a2be2;letter-spacing:1px;text-transform:uppercase}
        .il{position:absolute;bottom:0;left:0;width:0;height:2px;background:linear-gradient(90deg,#8a2be2,#d100ff);transition:width .3s}
        .ig input:focus~.il{width:100%}
        .btn{display:block;width:100%;padding:16px 30px;color:#c060ff;font-size:15px;text-transform:uppercase;letter-spacing:3px;font-weight:700;background:rgba(138,43,226,.08);border:2px solid #8a2be2;cursor:pointer;transition:all .35s;box-shadow:0 0 12px rgba(138,43,226,.2);margin-top:25px}
        .btn:hover:not(:disabled){background:#8a2be2;color:#fff;box-shadow:0 0 20px #8a2be2,0 0 50px rgba(138,43,226,.4);transform:translateY(-1px)}
        .btn:disabled{opacity:.5;cursor:not-allowed}
        .msg{text-align:center;margin-top:18px;font-size:13px;min-height:22px;font-weight:600}
        .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid rgba(138,43,226,.2)}
        .lb{background:transparent;color:#ff3366;border:1px solid #ff3366;padding:9px 18px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .3s;border-radius:20px}
        .lb:hover{background:#ff3366;color:#fff;box-shadow:0 0 15px rgba(255,51,102,.5)}
        .cr{display:flex;gap:15px;align-items:stretch;margin-bottom:10px;flex-wrap:wrap}
        .sel{flex:1;min-width:160px;padding:13px 14px;font-size:15px;color:#fff;border:2px solid rgba(138,43,226,.4);outline:none;background:rgba(138,43,226,.08);border-radius:12px;cursor:pointer;appearance:none;-webkit-appearance:none;font-family:"Poppins",sans-serif;font-weight:600;transition:.3s}
        .sel:focus{border-color:#8a2be2;box-shadow:0 0 10px rgba(138,43,226,.3)}
        .sel option{background:#0f0f14;color:#fff}
        .bg{flex:2;min-width:180px;margin-top:0;padding:13px 20px;font-size:13px}
        .bc{flex:1;min-width:140px;margin-top:0;padding:13px 15px;font-size:12px;border-color:#ff3366;color:#ff3366;box-shadow:0 0 10px rgba(255,51,102,.15)}
        .bc:hover:not(:disabled){background:#ff3366;color:#fff;box-shadow:0 0 20px rgba(255,51,102,.5)}
        .tw{margin-top:25px;border-radius:12px;border:1px solid rgba(138,43,226,.2);overflow:auto;max-height:430px}
        table{width:100%;border-collapse:collapse;min-width:780px}
        th,td{padding:13px 15px;text-align:left;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;white-space:nowrap}
        th{background:rgba(138,43,226,.12);color:#c060ff;font-weight:700;letter-spacing:1px;font-size:12px;text-transform:uppercase;position:sticky;top:0;z-index:5}
        tr:hover td{background:rgba(138,43,226,.06)}
        .kt{font-family:"Courier New",monospace;font-size:14px;color:#e0e0ff;letter-spacing:1px}
        .dt{color:#888}
        .sa{color:#00ffcc;font-weight:700}
        .si{color:#d100ff;font-weight:800;text-shadow:0 0 8px rgba(209,0,255,.6)}
        .se{color:#ff3366;font-weight:700}
        .sn{color:#ff6666;font-weight:700}
        .ab{padding:5px 11px;border-radius:6px;border:1px solid;cursor:pointer;font-size:11px;font-weight:700;margin-right:4px;transition:all .25s;background:transparent;font-family:"Poppins",sans-serif;text-transform:uppercase}
        .ab:hover{transform:scale(1.06)}
        .aban{color:#ffcc00;border-color:#ffcc00}.aban:hover{background:#ffcc00;color:#000}
        .aub{color:#00ffcc;border-color:#00ffcc}.aub:hover{background:#00ffcc;color:#000}
        .ahw{color:#44aaff;border-color:#44aaff}.ahw:hover{background:#44aaff;color:#000}
        .adl{color:#ff3366;border-color:#ff3366}.adl:hover{background:#ff3366;color:#fff}
    </style>
</head>
<body>
<div class="glow"></div>
<div class="wrap" id="WRP">

    <div id="AUTH" class="card">
        <div class="logo">HETRAX</div>
        <div class="sub">Premium Cheat Services</div>
        <div class="ig">
            <input type="text" id="UN" required>
            <label>Username</label>
            <div class="il"></div>
        </div>
        <div class="ig">
            <input type="password" id="UP" required>
            <label>Password</label>
            <div class="il"></div>
        </div>
        <button class="btn rd" id="LBTN">ENTER SYSTEM</button>
        <p class="msg" id="AMSG"></p>
    </div>

    <div id="PNL" style="display:none;width:1050px;max-width:100%">
        <div class="card">
            <div class="ph">
                <div class="logo sm">HETRAX CONTROL</div>
                <button class="lb" id="LOBTN">&#x2192; Logout</button>
            </div>
            <div class="cr">
                <select id="DUR" class="sel">
                    <option value="1">1 Day</option>
                    <option value="7">7 Days</option>
                    <option value="30" selected>30 Days</option>
                    <option value="365">1 Year</option>
                    <option value="infinite">&#x221e; Infinite (Lifetime)</option>
                </select>
                <button class="btn bg rd" id="GBTN">+ Generate License</button>
                <button class="btn bc rd" id="CLBTN">&#x1F5D1; Clear All</button>
            </div>
            <p class="msg" id="PMSG"></p>
            <div class="tw">
                <table>
                    <thead>
                        <tr>
                            <th>License Key</th>
                            <th>Created</th>
                            <th>Expires</th>
                            <th>Status</th>
                            <th>HWID</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="TB"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
var DB = "https://jsonblob.com/api/jsonBlob/019ed74c-ec82-7373-8612-cdd702f397df";
var _keys = [];

function pmsg(txt, err) {
    var el = document.getElementById("PMSG");
    el.textContent = txt;
    el.style.color = err ? "#ff3366" : "#00ffcc";
    clearTimeout(pmsg._t);
    pmsg._t = setTimeout(function(){ el.textContent=""; }, 3500);
}
function amsg(txt, err) {
    var el = document.getElementById("AMSG");
    el.textContent = txt;
    el.style.color = err ? "#ff3366" : "#00ffcc";
}

function showPanel(on) {
    document.getElementById("AUTH").style.display = on ? "none" : "block";
    document.getElementById("PNL").style.display  = on ? "block" : "none";
    document.getElementById("WRP").style.maxWidth  = on ? "1100px" : "480px";
    if (on) { fetchKeys(function(k){ _keys=k; render(); }); }
}

function fetchKeys(cb) {
    fetch(DB)
        .then(function(r){ return r.ok ? r.json() : []; })
        .then(function(d){ cb(Array.isArray(d) ? d : []); })
        .catch(function(){ cb([]); });
}

function saveKeys(cb) {
    fetch(DB, {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify(_keys)
    }).then(function(){ if(cb) cb(); }).catch(function(){ if(cb) cb(); });
}

function render() {
    var tb = document.getElementById("TB");
    tb.innerHTML = "";
    var list = _keys.slice().reverse();
    list.forEach(function(k, ri) {
        var realIdx = _keys.length - 1 - ri;
        var sc, st, ex;
        if (k.isInfinite) {
            sc="si"; st="INFINITE"; ex="NEVER";
        } else if (!k.expiresAt || new Date() > new Date(k.expiresAt)) {
            sc="se"; st="EXPIRED"; ex=k.expiresAt ? new Date(k.expiresAt).toLocaleDateString() : "-";
        } else {
            sc="sa"; st="ACTIVE"; ex=new Date(k.expiresAt).toLocaleDateString();
        }
        if (!k.isActive && sc!=="se") { sc="sn"; st="INACTIVE"; }
        var hwid = k.hwid ? k.hwid.substring(0,10)+"..." : "Not Bound";
        var banCls = k.isActive ? "ab aban" : "ab aub";
        var banTxt = k.isActive ? "Ban" : "Unban";

        var tr = document.createElement("tr");
        tr.innerHTML =
            '<td><span class="kt">'+k.key+'</span></td>' +
            '<td class="dt">'+new Date(k.createdAt).toLocaleDateString()+'</td>' +
            '<td class="dt">'+ex+'</td>' +
            '<td class="'+sc+'">'+st+'</td>' +
            '<td class="dt">'+hwid+'</td>' +
            '<td>' +
              '<button class="'+banCls+'" data-i="'+realIdx+'" data-a="ban">'+banTxt+'</button>' +
              '<button class="ab ahw" data-i="'+realIdx+'" data-a="hwid">Reset HWID</button>' +
              '<button class="ab adl" data-i="'+realIdx+'" data-a="del">Delete</button>' +
            '</td>';
        tb.appendChild(tr);
    });
}

// Single delegated listener on table body - set once, never removed
document.getElementById("TB").addEventListener("click", function(e) {
    var btn = e.target.closest("button[data-a]");
    if (!btn) return;
    var action = btn.getAttribute("data-a");
    var idx    = parseInt(btn.getAttribute("data-i"), 10);
    if (isNaN(idx) || idx < 0 || idx >= _keys.length) return;

    if (action === "ban") {
        _keys[idx].isActive = !_keys[idx].isActive;
        render();
        saveKeys(function(){ pmsg(_keys[idx].isActive ? "Key Unbanned!" : "Key Banned!"); });

    } else if (action === "hwid") {
        _keys[idx].hwid = null;
        render();
        saveKeys(function(){ pmsg("HWID Reset!"); });

    } else if (action === "del") {
        if (!confirm("Delete key: " + _keys[idx].key + "?")) return;
        _keys.splice(idx, 1);
        render();
        saveKeys(function(){ pmsg("Key Deleted!"); });
    }
});

document.getElementById("LBTN").addEventListener("click", function() {
    var u = document.getElementById("UN").value;
    var p = document.getElementById("UP").value;
    if (u === "Hetrax" && p === "Hetrax123") {
        localStorage.setItem("hx","1");
        amsg("Access Granted!", false);
        setTimeout(function(){ showPanel(true); }, 350);
    } else {
        amsg("Invalid Credentials!", true);
    }
});

document.getElementById("UP").addEventListener("keydown", function(e){
    if(e.key==="Enter") document.getElementById("LBTN").click();
});
document.getElementById("UN").addEventListener("keydown", function(e){
    if(e.key==="Enter") document.getElementById("LBTN").click();
});

document.getElementById("LOBTN").addEventListener("click", function() {
    localStorage.removeItem("hx");
    showPanel(false);
});

document.getElementById("GBTN").addEventListener("click", function() {
    var btn = this;
    btn.disabled = true;
    btn.textContent = "Generating...";
    var dur = document.getElementById("DUR").value;
    var ch = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    var rnd = function(){ return Array.from({length:4},function(){ return ch[Math.floor(Math.random()*ch.length)]; }).join(""); };
    var key = "HTRX-"+rnd()+"-"+rnd()+"-"+rnd();
    var exp = dur==="infinite" ? null : new Date(Date.now()+parseInt(dur)*86400000).toISOString();
    _keys.push({ key:key, createdAt:new Date().toISOString(), expiresAt:exp, isActive:true, isInfinite:dur==="infinite", hwid:null });
    render();
    saveKeys(function(){
        pmsg("Generated: "+key);
        btn.disabled = false;
        btn.textContent = "+ Generate License";
    });
});

document.getElementById("CLBTN").addEventListener("click", function() {
    if (!confirm("Delete ALL keys? Cannot be undone!")) return;
    _keys = [];
    render();
    saveKeys(function(){ pmsg("All keys cleared!", true); });
});

// Init
if (localStorage.getItem("hx") === "1") { showPanel(true); } else { showPanel(false); }
</script>
</body>
</html>
